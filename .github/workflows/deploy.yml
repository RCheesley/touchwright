name: Deploy

# Deployment is kept in its own workflow, behind a switch, and gated on CI.
#
# Behind a switch because GitHub Pages cannot publish from a private repository
# without a paid plan. While this repository is private the switch stays off and
# CI simply keeps the built site as a downloadable artifact.
#
# Gated on CI because publishing a build whose tests never ran is exactly the
# kind of thing this project is trying not to do. This workflow runs only after
# the CI workflow has gone green for a commit, and it deploys that same commit.
#
# The build is a plain static bundle with no server and no runtime network calls,
# so the host is interchangeable. Only the last three steps are host-specific:
# point them at Cloudflare Pages or anywhere else and nothing above changes.
#
# To turn it on:
#   1. Settings, Pages, Source: GitHub Actions.
#   2. Settings, Secrets and variables, Actions, Variables: PAGES_ENABLED = true.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: GitHub Pages
    # A manual run is a deliberate act and is allowed; an automatic one only
    # follows a CI run that passed.
    if: >-
      vars.PAGES_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Deploy the exact commit CI proved green, not whatever main is now.
          ref: >-
            ${{ github.event_name == 'workflow_run'
                && github.event.workflow_run.head_sha
                || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # Cheap second gate, so a manual dispatch cannot publish a broken build
      # either. The end-to-end and axe suites are covered by the CI gate above.
      - name: Lint, typecheck and test
        run: npm run verify

      - name: Build for a project site served from a subpath
        run: |
          repo_name="${GITHUB_REPOSITORY#*/}"
          echo "Building with base /${repo_name}/"
          VITE_BASE="/${repo_name}/" npm run build

      - name: Fail if the build produced nothing
        run: test -s dist/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
